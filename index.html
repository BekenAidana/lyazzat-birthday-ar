<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Happy Birthday Ляззат — AR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="modulepreload" href="./js/app.js" />
    <link rel="preload" href="./assets/marker-preview.jpg" as="image" />
    <link rel="prefetch" href="./models/main.glb" as="fetch" crossorigin />
    <link rel="prefetch" href="./assets/targets.mind" as="fetch" crossorigin />
    <link
      rel="prefetch"
      href="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      as="script"
      crossorigin
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="ar-container"></div>
    <canvas id="confetti"></canvas>

    <div id="unlock-banner" class="unlock-banner" aria-hidden="true">
      <p class="unlock-kicker">NEW CHARACTER UNLOCKED</p>
      <p class="unlock-level">LEVEL 27</p>
    </div>

    <div id="hud">
      <div class="top">
        <h1 id="title">HAPPY BIRTHDAY</h1>
        <p id="status">Нажми Start и разреши камеру</p>
        <p id="emote-label">—</p>
      </div>
      <div id="controls">
        <button class="nav-btn" id="prev-btn" type="button" aria-label="Предыдущая">←</button>
        <button class="nav-btn" id="mute-btn" type="button" aria-label="Музыка">♪</button>
        <button class="nav-btn" id="next-btn" type="button" aria-label="Следующая">→</button>
      </div>
    </div>

    <div id="start-overlay">
      <div class="scan-frame" aria-hidden="true">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
      </div>

      <div class="intro">
        <p class="intro-kicker">UNKNOWN CHARACTER</p>
        <div class="intro-art">
          <img
            src="./assets/marker-preview.jpg"
            alt="Mystery character card"
            width="512"
            height="682"
            decoding="async"
            fetchpriority="high"
          />
          <div class="intro-glow"></div>
        </div>
        <h1 class="intro-name">ЛЯЗЗАТ</h1>
        <p class="intro-level">LEVEL 27</p>
        <p class="intro-copy">
          Наведи камеру на карточку — и разблокируй персонажа
        </p>
        <button id="start-btn" type="button">SCAN TO UNLOCK</button>
        <p class="hint">Safari · разреши камеру · затем наведи на силуэт</p>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
