<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Happy Birthday Ляззат — AR</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="ar-container"></div>
    <canvas id="confetti"></canvas>

    <div id="hud">
      <div class="top">
        <h1 id="title">HAPPY BIRTHDAY</h1>
        <p id="status">Нажми Start и разреши камеру</p>
        <p id="emote-label">—</p>
      </div>
      <div id="controls">
        <button class="nav-btn" id="prev-btn" type="button" aria-label="Предыдущая">←</button>
        <button class="nav-btn" id="next-btn" type="button" aria-label="Следующая">→</button>
      </div>
    </div>

    <div id="start-overlay">
      <div class="card">
        <h1>ЛЯЗЗАТ</h1>
        <p>
          Открой камеру, наведи на <strong>метку на лицевой стороне</strong>
          карточки — и смотри эмоуты. Стрелки листают танцы.
        </p>
        <button id="start-btn" type="button">Start AR</button>
        <p class="hint">Нужен HTTPS и доступ к камере · Safari / Chrome</p>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
