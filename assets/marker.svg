<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="55%" stop-color="#163B6B"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4" fill="#FFE8A3" fill-opacity="0.55"/>
      <circle cx="32" cy="28" r="3" fill="#FFFFFF" fill-opacity="0.35"/>
      <rect x="20" y="4" width="10" height="10" fill="#E76F51" fill-opacity="0.45" transform="rotate(20 25 9)"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#dots)"/>

  <!-- high-contrast frame for tracking -->
  <rect x="48" y="48" width="1104" height="1504" rx="36" fill="none" stroke="#FFE8A3" stroke-width="18"/>
  <rect x="84" y="84" width="1032" height="1432" rx="28" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="18 14"/>

