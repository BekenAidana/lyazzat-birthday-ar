<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Эмоуты на одной модели</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1d3a;
        color: #ffe8a3;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #c {
        position: fixed;
        inset: 0;
      }
      #top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        padding: 14px 16px 8px;
        text-align: center;
        background: linear-gradient(to bottom, rgba(11, 29, 58, 0.92), transparent);
        pointer-events: none;
      }
      #top h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #fff;
      }
      #label {
        margin: 6px 0 0;
        font-size: 18px;
      }
      #hint {
        margin: 4px 0 0;
        font-size: 12px;
        opacity: 0.75;
      }
      #ui {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        padding: 12px 12px max(16px, env(safe-area-inset-bottom));
        background: linear-gradient(to top, rgba(11, 29, 58, 0.95), transparent);
      }
      #nav {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 10px;
      }
      #nav button {
        width: 56px;
        height: 56px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 232, 163, 0.18);
        color: #ffe8a3;
        font-size: 24px;
      }
      #list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 2px 8px;
        -webkit-overflow-scrolling: touch;
      }
      #list button {
        flex: 0 0 auto;
        border: 1px solid rgba(255, 232, 163, 0.35);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.06);
        color: #ffe8a3;
        font-size: 13px;
        white-space: nowrap;
      }
      #list button.active {
        background: #f4a261;
        color: #0b1d3a;
        border-color: #f4a261;
        font-weight: 700;
      }
      #list button:disabled {
        opacity: 0.45;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="top">
      <h1>Одна модель · анимации с других GLB</h1>
      <p id="label">Загрузка…</p>
      <p id="hint">Стрелки или чипы ниже — тот же персонаж, другой эмоут</p>
    </div>
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="nav">
        <button id="prev" type="button" aria-label="Prev">←</button>
        <button id="next" type="button" aria-label="Next">→</button>
      </div>
      <div id="list"></div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const label = document.getElementById("label");
      const listEl = document.getElementById("list");
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1d3a);
      const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
      camera.position.set(0, 1.2, 2.4);
      const controls = new OrbitControls(camera, canvas);
      controls.target.set(0, 0.9, 0);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2));
      const key = new THREE.DirectionalLight(0xffffff, 1.5);
      key.position.set(2, 3, 2);
      scene.add(key);

      const loader = new GLTFLoader();
      const manifest = await fetch("./models/manifest.json").then((r) => r.json());

      label.textContent = "Загрузка персонажа (main)…";
      const main = await loader.loadAsync("./models/main.glb");
      const model = main.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = 1.6 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);
      model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
      scene.add(model);

      const mixer = new THREE.AnimationMixer(model);
      const slots = manifest.clips.map((e) => ({ ...e, clip: null, btn: null }));

      // Idle сразу с main
      if (main.animations?.[0] && slots[0]?.file === "main.glb") {
        slots[0].clip = main.animations[0].clone();
        slots[0].clip.name = slots[0].label;
      }

      slots.forEach((slot, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = `${i + 1}. ${slot.label}`;
        btn.disabled = !slot.clip;
        btn.onclick = () => play(i);
        slot.btn = btn;
        listEl.appendChild(btn);
      });

      let index = 0;
      let action = null;

      function setActive(i) {
        slots.forEach((s, j) => s.btn.classList.toggle("active", j === i));
      }

      async function loadAllClips() {
        const jobs = slots.map(async (slot, i) => {
          if (slot.clip) {
            slot.btn.disabled = false;
            return;
          }
          const g = await loader.loadAsync("./models/" + slot.file);
          if (!g.animations?.[0]) return;
          slot.clip = g.animations[0].clone();
          slot.clip.name = slot.label;
          slot.btn.disabled = false;
          label.textContent = `Подгружаю анимации… ${i + 1}/${slots.length}`;
        });
        await Promise.all(jobs);
      }

      async function play(i) {
        index = (i + slots.length) % slots.length;
        const slot = slots[index];
        if (!slot.clip) {
          label.textContent = `Гружу ${slot.label}…`;
          const g = await loader.loadAsync("./models/" + slot.file);
          slot.clip = g.animations[0].clone();
          slot.clip.name = slot.label;
          slot.btn.disabled = false;
        }
        const next = mixer.clipAction(slot.clip);
        next.reset().setLoop(THREE.LoopRepeat, Infinity).fadeIn(0.15).play();
        if (action && action !== next) action.fadeOut(0.15);
        action = next;
        setActive(index);
        label.textContent = `${index + 1}/${slots.length} · ${slot.label}`;
        slot.btn.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      }

      await play(0);
      label.textContent = `1/${slots.length} · ${slots[0].label} · гружу остальные…`;
      loadAllClips().then(() => {
        label.textContent = `${index + 1}/${slots.length} · ${slots[index].label}`;
      });

      document.getElementById("prev").onclick = () => play(index - 1);
      document.getElementById("next").onclick = () => play(index + 1);
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") play(index - 1);
        if (e.key === "ArrowRight") play(index + 1);
      });

      const clock = new THREE.Clock();
      function resize() {
        const w = innerWidth;
        const h = innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      resize();
      window.addEventListener("resize", resize);

      renderer.setAnimationLoop(() => {
        mixer.update(clock.getDelta());
        controls.update();
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
