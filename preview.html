<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview dancer (без AR)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1d3a;
        color: #ffe8a3;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #c {
        position: fixed;
        inset: 0;
      }
      #ui {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 24px;
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        z-index: 2;
      }
      button {
        width: 56px;
        height: 56px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 232, 163, 0.15);
        color: #ffe8a3;
        font-size: 24px;
      }
      #label {
        position: fixed;
        top: 16px;
        width: 100%;
        text-align: center;
        z-index: 2;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="label">Загрузка…</div>
    <canvas id="c"></canvas>
    <div id="ui">
      <button id="prev" type="button">←</button>
      <button id="next" type="button">→</button>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const label = document.getElementById("label");
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1d3a);
      const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
      camera.position.set(0, 1.2, 2.4);
      const controls = new OrbitControls(camera, canvas);
      controls.target.set(0, 0.9, 0);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2));
      const key = new THREE.DirectionalLight(0xffffff, 1.5);
      key.position.set(2, 3, 2);
      scene.add(key);

      const loader = new GLTFLoader();
      const manifest = await fetch("./models/manifest.json").then((r) => r.json());
      const main = await loader.loadAsync("./models/main.glb");
      const model = main.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = 1.6 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);
      model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
      scene.add(model);

      const mixer = new THREE.AnimationMixer(model);
      const clips = [];
      for (const entry of manifest.clips) {
        label.textContent = "Загрузка " + entry.label + "…";
        const g = await loader.loadAsync("./models/" + entry.file);
        if (g.animations[0]) {
          const clip = g.animations[0].clone();
          clip.name = entry.label;
          clips.push({ label: entry.label, clip });
        }
      }

      let index = 0;
      let action = null;
      function play(i) {
        index = (i + clips.length) % clips.length;
        const next = mixer.clipAction(clips[index].clip);
        next.reset().setLoop(THREE.LoopRepeat, Infinity).fadeIn(0.2).play();
        if (action && action !== next) action.fadeOut(0.2);
        action = next;
        label.textContent = `${index + 1}/${clips.length} · ${clips[index].label}`;
      }
      play(0);

      document.getElementById("prev").onclick = () => play(index - 1);
      document.getElementById("next").onclick = () => play(index + 1);
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") play(index - 1);
        if (e.key === "ArrowRight") play(index + 1);
      });

      const clock = new THREE.Clock();
      function resize() {
        const w = innerWidth;
        const h = innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      resize();
      window.addEventListener("resize", resize);

      renderer.setAnimationLoop(() => {
        mixer.update(clock.getDelta());
        controls.update();
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
